<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">GazeSync: align gaze with the view at capture time</title>
  <desc id="desc">Desktop and mobile screen changes enter a shared session timeline. Gaze samples retain their capture times even when delivered later. The captured view maps each independent eye into content coordinates. Python and TypeScript share this recording contract.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#647b7b" stroke-width="1.5"/></marker>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e1e9e6" stroke-width="1"/></pattern>
  </defs>
  <rect width="1120" height="480" rx="20" fill="#f3f6f3"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#193d40">
    <text x="32" y="44" font-size="12" font-weight="700" letter-spacing="2">GAZESYNC / PYTHON + TYPESCRIPT</text>
    <text x="32" y="84" font-size="30" font-weight="650" letter-spacing="-.6">Align gaze with the view at capture time.</text>

    <rect x="28" y="110" width="316" height="308" rx="14" fill="#fff" stroke="#d8e3df"/>
    <text x="48" y="145" font-size="12" font-weight="700" fill="#5c7778">01 / INTERACTION</text>
    <text x="48" y="177" font-size="23" font-weight="650">Screen state changes</text>
    <rect x="57" y="206" width="187" height="118" rx="8" fill="#eff6f3" stroke="#497875" stroke-width="2"/>
    <path d="M57 232H244" stroke="#bdd0c8"/>
    <circle cx="70" cy="219" r="3" fill="#709b8b"/><circle cx="81" cy="219" r="3" fill="#9bb9aa"/>
    <rect x="95" y="246" width="109" height="62" rx="3" fill="#d0e6dd" stroke="#147d73" transform="rotate(-10 150 277)"/>
    <path d="M111 283 139 258 166 283 185 270 199 292" fill="none" stroke="#498879" stroke-width="3" transform="rotate(-10 150 277)"/>
    <path d="M150 325V338M123 339H177" stroke="#497875" stroke-width="3"/>
    <rect x="232" y="240" width="62" height="108" rx="10" fill="#fff" stroke="#497875" stroke-width="2"/>
    <rect x="240" y="255" width="46" height="77" rx="3" fill="#d0e6dd"/>
    <path d="M257 249H269M258 340H268" stroke="#497875" stroke-width="2" stroke-linecap="round"/>
    <text x="48" y="377" font-size="17">Move · zoom · rotate · select</text>
    <text x="48" y="401" font-size="14" fill="#5c7778">Desktop and mobile · independent rates</text>

    <path d="M348 267H370" fill="none" stroke="#647b7b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="376" y="110" width="368" height="308" rx="14" fill="#e7f1ed" stroke="#bfd4ca"/>
    <text x="398" y="145" font-size="12" font-weight="700" fill="#426b63">02 / SYNCHRONIZATION</text>
    <text x="398" y="177" font-size="23" font-weight="650">Preserve capture time</text>
    <text x="398" y="212" font-size="13" fill="#526f68">SESSION TIME</text>
    <path d="M407 240H709" stroke="#8cab9e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="411" y="226" width="62" height="29" rx="5" fill="#f7fbf8" stroke="#9ebcae"/>
    <rect x="492" y="226" width="82" height="29" rx="5" fill="#176d61"/>
    <rect x="593" y="226" width="62" height="29" rx="5" fill="#f7fbf8" stroke="#9ebcae"/>
    <text x="442" y="246" text-anchor="middle" font-size="14">View 0</text>
    <text x="533" y="246" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">View 1</text>
    <text x="624" y="246" text-anchor="middle" font-size="14">View 2</text>
    <path d="M533 259V302" stroke="#176d61" stroke-width="2" stroke-dasharray="3 4"/>
    <path d="M533 309H676" stroke="#ad642f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <circle cx="533" cy="309" r="7" fill="#176d61" stroke="#fff" stroke-width="2"/>
    <circle cx="683" cy="309" r="7" fill="#fff" stroke="#ad642f" stroke-width="2"/>
    <text x="533" y="337" text-anchor="middle" font-size="15" font-weight="650">Capture</text>
    <text x="683" y="337" text-anchor="middle" font-size="15">Delivery</text>
    <text x="398" y="377" font-size="17">Select the captured view</text>
    <text x="398" y="401" font-size="14" fill="#526f68">Clock epochs · surface history · replay</text>

    <path d="M748 267H770" fill="none" stroke="#647b7b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="776" y="110" width="316" height="308" rx="14" fill="#fff" stroke="#d8e3df"/>
    <text x="796" y="145" font-size="12" font-weight="700" fill="#5c7778">03 / ANALYSIS</text>
    <text x="796" y="177" font-size="23" font-weight="650">Keep content coordinates</text>
    <rect x="818" y="202" width="226" height="146" rx="6" fill="url(#grid)"/>
    <g transform="rotate(-10 937 271)">
      <rect x="879" y="219" width="117" height="96" rx="3" fill="#f0f6f2" stroke="#628f80" stroke-width="1.5"/>
      <path d="M894 236H978M894 247H966M894 258H978M894 288H978M894 299H962" stroke="#b5cdbf" stroke-width="3"/>
      <circle cx="934" cy="274" r="5" fill="#147d73"/>
      <path d="M949 268 955 280H943Z" fill="#af622c"/>
      <path d="M879 272V219H931" fill="none" stroke="#496e66" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <circle cx="879" cy="219" r="3" fill="#193d40"/>
      <text x="938" y="223" font-size="12">x</text><text x="875" y="288" font-size="12">y</text>
    </g>
    <text x="827" y="343" font-size="12" fill="#5c7778">Content origin: top-left (0, 0)</text>
    <circle cx="1009" cy="216" r="4" fill="#147d73"/><text x="1019" y="220" font-size="12">L</text>
    <path d="M1009 231 1013 239H1005Z" fill="#af622c"/><text x="1019" y="239" font-size="12">R</text>
    <text x="796" y="377" font-size="17">2D PoG or calibrated 3D rays</text>
    <text x="796" y="401" font-size="14" fill="#5c7778">Independent eyes · explicit quality flags</text>
    <text x="32" y="452" font-size="15" fill="#4e6d69">Measured clocks + geometry in</text>
    <path d="M290 447H336" stroke="#647b7b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="350" y="452" font-size="15" fill="#4e6d69">Versioned records + diagnostics out</text>
    <text x="1088" y="452" text-anchor="end" font-size="14" font-weight="600" fill="#176d61">No runtime dependencies</text>
  </g>
</svg>
